name: Bootstrap waste-watcher repo (WEA-88)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/waste-watcher-repo-wea88.yml
      - scripts/waste_watcher_repo_wea88.py

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create repo, push socle, align Linear (WEA-88)
        env:
          GITHUB_ORG_REPO_CREATE_TOKEN: ${{ secrets.GITHUB_ORG_REPO_CREATE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python3 scripts/waste_watcher_repo_wea88.py --apply
